# ==========================================================================
# MBTI 小游戏 —— nginx 配置片段
#
# 插入位置：/etc/nginx/sites-enabled/oictech 里 HTTPS server 块内部，
#           紧跟在 `root /var/www/oictech;` 之后、原有的 `location = /` 之前。
#
# 设计约束（务必遵守）：
#   1. 不得影响同站点已有的 /fsl/ 、/wiki/ 、/ollama/ 三个服务
#   2. 根路径 `/` 已被现有规则硬编码为 try_files /index.html =404，不要去改它
#   3. 本游戏的接口走 /games/mbti/api/ 反代，静态走 /games/mbti/
# ==========================================================================

# ---------- 接口反代 ----------
# 用 ^~ 抢占前缀匹配，避免被后面的正则 location 抢走；
# proxy_pass 故意不带结尾斜杠 —— 保留完整 URI，由应用自己按 MBTI_BASE_PATH 剥离。
location ^~ /games/mbti/api/ {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection        "";

    proxy_connect_timeout 5s;
    proxy_send_timeout    30s;
    proxy_read_timeout    30s;

    # 与后端 64KB 的请求体上限对齐，留点余量
    client_max_body_size 128k;

    # 接口一律不缓存
    add_header Cache-Control "no-store" always;
}

# ---------- 不带斜杠的入口重定向 ----------
location = /games/mbti {
    return 301 /games/mbti/;
}

# ---------- 静态资源 + SPA 回退 ----------
# 不加 ^~，好让下面的图片正则能生效
location /games/mbti/ {
    root /var/www/oictech;
    index index.html;
    # 深链接（如 /games/mbti/s/abc123）没有对应文件，回退到 index.html 交给前端路由
    try_files $uri $uri/ /games/mbti/index.html;

    # html 每次回源校验，保证发版后立刻生效
    add_header Cache-Control "no-cache" always;
}

# 图片与字体可以放心长缓存（文件名稳定，改图时换名即可）
location ~* ^/games/mbti/.+\.(png|jpe?g|gif|svg|webp|ico|woff2?)$ {
    root /var/www/oictech;
    expires 7d;
    add_header Cache-Control "public, max-age=604800, immutable";
    access_log off;
}

# ==========================================================================
# 以下内容不放这里，需单独写入 /etc/nginx/conf.d/mbti-limit.conf
# （limit_req_zone 只能定义在 http 上下文，放 sites-enabled 里会报错）
#
#   limit_req_zone  $binary_remote_addr zone=mbti_api:10m rate=50r/s;
#   limit_conn_zone $binary_remote_addr zone=mbti_conn:10m;
#
# 并在上面的 api location 里补两行：
#   limit_req  zone=mbti_api burst=100 nodelay;
#   limit_conn zone=mbti_conn 50;
#
# 注意：50r/s 是防滥用的上限，正常使用远达不到。
# 压测时若发现被 503 拦住，说明触到了这一层，而不是应用扛不住。
# ==========================================================================
